<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IgniteXT – an e-learning platform where faculty share lectures and files and students learn with the help of an AI assistant.">
    <title>{% block title %}IgniteXT{% endblock %} · IgniteXT</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script>
        // Apply saved theme before paint to avoid a flash of the wrong theme
        try { if (localStorage.getItem('dark-mode') === 'enabled') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
    </script>
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
