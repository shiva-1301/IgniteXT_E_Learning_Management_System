{% extends "layout.html" %}
{% set active = 'upload' %}
{% block title %}Upload{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Upload study material</h1>
        <p>Share notes, slides, assignments or lecture videos with your students.</p>
    </div>
    <a href="{{ url_for('download') }}" class="btn btn-outline"><i class="fas fa-folder-open" aria-hidden="true"></i> View uploaded files</a>
</div>

<form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data" class="card" style="max-width: 640px;" id="upload-form">
    <label class="dropzone" id="dropzone" for="file">
        <i class="fas fa-cloud-arrow-up" aria-hidden="true"></i>
        <p style="margin: 0;"><strong>Click to choose a file</strong> or drag and drop it here</p>
        <p class="hint" style="margin: .25rem 0 0;">PDF, DOCX, PPTX, ZIP, MP4 and more · max {{ max_mb }} MB</p>
        <p class="file-name" id="file-name" aria-live="polite"></p>
        <input type="file" id="file" name="file" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;" id="upload-btn">
        <i class="fas fa-upload" aria-hidden="true"></i> Upload file
    </button>
</form>
{% endblock %}
{% block scripts %}
<script>
    (function () {
        const input = document.getElementById('file');
        const zone = document.getElementById('dropzone');
        const nameEl = document.getElementById('file-name');
        const maxBytes = {{ max_mb }} * 1024 * 1024;
        const btn = document.getElementById('upload-btn');

        function showFile() {
            const f = input.files[0];
            if (!f) { nameEl.textContent = ''; return; }
            if (f.size > maxBytes) {
                nameEl.textContent = f.name + ' is too large (max {{ max_mb }} MB)';
                input.value = '';
                return;
            }
            nameEl.textContent = f.name + ' · ' + Math.max(1, Math.round(f.size / 1024)) + ' KB';
        }
        input.addEventListener('change', showFile);
        ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('dragover'); }));
        ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('dragover'); }));
        zone.addEventListener('drop', e => { input.files = e.dataTransfer.files; showFile(); });
        document.getElementById('upload-form').addEventListener('submit', () => {
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Uploading…';
        });
    })();
</script>
{% endblock %}
